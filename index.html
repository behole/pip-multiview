<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0b">
<title>PIP — multiview</title>
<style>
  :root {
    --bg: #0a0a0b; --pane: #101013; --edge: #232329; --edge-hi: #3a3a44;
    --text: #ececf1; --dim: #8b8b96; --accent: #f05a28; --danger: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }

  #topbar { height: 48px; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; border-bottom: 1px solid var(--edge); background: var(--pane); }
  #topbar .logo { font-weight: 700; letter-spacing: .06em; color: var(--accent); }
  #url { flex: 0 1 340px; background: #0a0a0b; border: 1px solid var(--edge);
    color: var(--text); border-radius: 6px; padding: 6px 10px; font: inherit; }
  #url:focus { outline: none; border-color: var(--accent); }
  .btn { background: #16161a; border: 1px solid var(--edge); color: var(--text);
    border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--edge-hi); background: #1d1d22; }
  .btn.accent { border-color: var(--accent); color: var(--accent); }
  .btn.on { background: var(--accent); color: #000; border-color: var(--accent); }
  .spacer { flex: 1; }
  #note { color: var(--dim); font-size: 12px; max-width: 320px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  #toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: #1d1d22; border: 1px solid var(--edge-hi); border-radius: 8px;
    padding: 8px 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9999; }
  #toast.show { opacity: 1; }

  #canvas { position: relative; height: calc(100% - 48px); overflow: hidden;
    background:
      linear-gradient(var(--edge) 1px, transparent 1px) 0 0 / 100% 96px,
      linear-gradient(90deg, var(--edge) 1px, transparent 1px) 0 0 / 96px 100%; }
  #canvas.drop-ok { outline: 2px dashed var(--accent); outline-offset: -6px; }

  #empty { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; color: var(--dim); text-align: center; padding: 20px; z-index: 0; }
  #empty.show { display: flex; }

  .pane { position: absolute; background: var(--pane); border: 1px solid var(--edge);
    border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  .pane.focus { border-color: var(--edge-hi); }
  .pane.solo { border-color: var(--accent); }
  .pane.replace { border-color: var(--accent); border-style: dashed; }

  .head { height: 30px; flex: 0 0 30px; display: flex; align-items: center; gap: 6px;
    padding: 0 4px 0 10px; background: rgba(16,16,19,.92); cursor: grab; user-select: none; }
  .head:active { cursor: grabbing; }
  .title { flex: 1; font-size: 12px; color: var(--dim); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .icon { width: 26px; height: 24px; border: 0; background: transparent; color: var(--dim);
    border-radius: 5px; cursor: pointer; font-size: 13px; line-height: 1; }
  .icon:hover { background: #1d1d22; color: var(--text); }
  .icon.audio.on { color: var(--accent); }
  .icon.focusb.on { color: var(--accent); }
  .icon.close:hover { color: var(--danger); }

  .stage { position: relative; flex: 1; background: #000; }
  .stage .mount, .stage iframe, .stage video { position: absolute; inset: 0;
    width: 100%; height: 100%; border: 0; }
  .veil { position: absolute; inset: 0; z-index: 2; cursor: pointer; }
  .badge { position: absolute; top: 8px; left: 8px; z-index: 3; background: var(--danger);
    color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 5px; display: none; }

  .bar { height: 4px; background: #1a1a1f; cursor: pointer; }
  .bar > div { height: 100%; width: 0%; background: var(--accent); }

  /* chat/twitch/web panes: iframe is the interaction — no transport chrome */
  .pane.chat .play, .pane.chat .audio, .pane.chat .bar,
  .pane.twitch .play, .pane.twitch .audio, .pane.twitch .bar,
  .pane.web .play, .pane.web .audio, .pane.web .bar { display: none; }
  .pane.chat .stage, .pane.twitch .stage, .pane.web .stage { background: var(--pane); }

  /* while dragging, iframes must not eat the pointer (the "jump" fix),
     and the dragged pane must not shadow the drop target (the swap fix) */
  body.dragging .stage iframe, body.dragging .stage video { pointer-events: none; }
  body.dragging .pane.lift { pointer-events: none; }

  .grip { position: absolute; right: 2px; bottom: 5px; width: 14px; height: 14px;
    cursor: nwse-resize; z-index: 4;
    background: linear-gradient(135deg, transparent 50%, var(--edge-hi) 50%); }
</style>
</head>
<body>

<div id="topbar">
  <span class="logo">PIP</span>
  <input id="url" type="text" placeholder="paste a url — yt / twitch / vimeo / mp4 / any page" spellcheck="false">
  <button class="btn accent" id="add">+ add</button>
  <button class="btn" data-mode="video" title="url box adds video panes">video</button>
  <button class="btn" data-mode="chat" title="url box adds a live chat pane">chat</button>
  <span class="spacer"></span>
  <button class="btn" data-preset="verticals" title="stack verticals in columns">3-verticals</button>
  <button class="btn" data-preset="grid" title="equal tiles">grid</button>
  <button class="btn" data-preset="focus" title="one big + column">focus</button>
  <button class="btn" data-preset="cascade" title="offset tiles">cascade</button>
  <button class="btn" id="muteall" title="silence every pane">mute all</button>
  <button class="btn" id="demo" title="load the demo wall">demo</button>
  <button class="btn" id="clear" title="empty the canvas">clear</button>
  <span id="note"></span>
</div>

<div id="canvas">
  <div id="empty">empty wall — drop a url anywhere, or paste one above<br><br>
    <span style="font-size:11px">youtube · twitch · vimeo · direct video files · any page that allows embedding</span></div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* PIP v1.2 — masonry multiview.
   Panes are containers: drag headers (drop on another pane = swap),
   drop URLs onto a pane to replace it or onto the canvas for a new pane,
   ◎ picks the focused pane, ✎ rearms a container for a new url.
   Kinds: youtube video, live chat, twitch, vimeo, direct video files, generic web. */

const LS_KEY = 'pip.v1', LS_SEEN = 'pip.seen', LS_FOCUS = 'pip.focus';
const MAX_PANES = 6;
const canvas = document.getElementById('canvas');
let zTop = 10;
const panes = new Map();          // id -> pane record
let soloId = null;
let focusKey = null;              // vid||src of the focused pane (persists)
let armed = null;                 // pane record waiting for a replacement url

/* ---------- utils ---------- */
const $ = (s, el=document) => el.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = () => Math.random().toString(36).slice(2, 9);
const keyOf = c => c.vid || c.src || '';

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- universal url parser ---------- */
function parseRef(raw) {
  const s = (raw || '').trim().split(/\s+/)[0] || '';
  if (!s) return null;
  if (/^[\w-]{11}$/.test(s)) return { kind: 'video', vid: s };
  let url;
  try { url = new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s); } catch { return null; }
  const h = url.hostname.replace(/^www\./, '');
  if (h === 'youtube.com' || h === 'm.youtube.com' || h === 'youtu.be') {
    let vid = null;
    if (h === 'youtu.be') vid = url.pathname.slice(1);
    else if (url.pathname === '/watch') vid = url.searchParams.get('v');
    else { const m = url.pathname.match(/^\/(?:shorts|live|embed|v)\/([\w-]{11})/); vid = m && m[1]; }
    return vid ? { kind: 'video', vid } : null;
  }
  if (h === 'twitch.tv') {
    const parts = url.pathname.split('/').filter(Boolean);
    if (parts[0] === 'videos') return { kind: 'twitch', src: `https://player.twitch.tv/?video=${parts[1]}&parent=${location.hostname}&muted=true` };
    return parts[0] ? { kind: 'twitch', src: `https://player.twitch.tv/?channel=${parts[0]}&parent=${location.hostname}&muted=true` } : null;
  }
  if (h === 'clips.twitch.tv')
    return { kind: 'twitch', src: `https://clips.twitch.tv/embed?clip=${url.pathname.slice(1)}&parent=${location.hostname}&muted=true` };
  if (h === 'vimeo.com') {
    const id = url.pathname.split('/').filter(Boolean)[0];
    return id ? { kind: 'web', src: `https://player.vimeo.com/video/${id}` } : null;
  }
  if (/\.(mp4|webm|ogg|mov|m4v)$/i.test(url.pathname)) return { kind: 'file', src: s };
  return /^https?:/i.test(url.href) ? { kind: 'web', src: url.href } : null;
}

/* ---------- persistence ---------- */
function save() {
  const data = [...panes.values()].map(p => ({
    kind: p.kind, vid: p.vid, src: p.src, rect: p.rect, title: p.title
  }));
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  localStorage.setItem(LS_FOCUS, focusKey || '');
  toggleEmpty();
}
const load = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch { return null; } };

function toggleEmpty() {
  $('#empty').classList.toggle('show', panes.size === 0);
}

/* ---------- pane lifecycle ---------- */
function addPane(content, rect, opts = {}) {
  if (panes.size >= MAX_PANES) { toast(`cap is ${MAX_PANES} panes — each one is heavy`); return null; }
  const id = uid();
  const kind = content.kind;
  const el = document.createElement('div');
  el.className = 'pane ' + kind; el.dataset.id = id;
  el.innerHTML = `
    <div class="head">
      <span class="title">loading…</span>
      <button class="icon play" title="play / pause">⏸</button>
      <button class="icon audio" title="solo audio">🔇</button>
      <button class="icon focusb" title="make this the focused pane">◎</button>
      <button class="icon swapr" title="reuse this container for a new url">✎</button>
      <button class="icon close" title="remove">✕</button>
    </div>
    <div class="stage">
      <div class="mount"></div>
      <div class="veil" title="click: solo audio"></div>
      <div class="badge"></div>
    </div>
    <div class="bar" title="seek"><div></div></div>
    <div class="grip"></div>`;
  canvas.appendChild(el);

  const rec = { id, kind, vid: content.vid, src: content.src, el, rect,
    player: null, media: null, title: content.title || '', playing: false, prevRect: null };
  panes.set(id, rec);
  applyRect(rec);

  el.addEventListener('pointerdown', () => focusPane(rec));
  $('.head', el).addEventListener('pointerdown', e => startDrag(e, rec));
  $('.head', el).addEventListener('dblclick', () => toggleMax(rec));
  $('.grip', el).addEventListener('pointerdown', e => startResize(e, rec));
  $('.veil', el).addEventListener('click', () => veilClick(rec));
  $('.play', el).addEventListener('click', () => togglePlay(rec));
  $('.audio', el).addEventListener('click', () => toggleSolo(rec));
  $('.focusb', el).addEventListener('click', () => setFocus(rec));
  $('.swapr', el).addEventListener('click', () => armReplace(rec));
  $('.close', el).addEventListener('click', () => removePane(rec));
  $('.bar', el).addEventListener('click', e => {
    const bar = e.currentTarget;
    const frac = e.offsetX / bar.offsetWidth;
    if (rec.player && rec.player.getDuration) {
      const d = rec.player.getDuration();
      if (d > 0) rec.player.seekTo(frac * d, true);
    } else if (rec.media && rec.media.duration > 0) {
      rec.media.currentTime = frac * rec.media.duration;
    }
  });

  if (kind === 'video') buildVideoPane(rec, opts);
  else if (kind === 'chat') buildChatPane(rec, opts);
  else if (kind === 'twitch') buildIframePane(rec, rec.src, 'twitch (muted embed)');
  else if (kind === 'web') buildIframePane(rec, rec.src, 'embedded page');
  else if (kind === 'file') buildFilePane(rec);

  if (!opts.silent) save();
  return rec;
}

function removePane(rec, opts = {}) {
  if (soloId === rec.id) soloId = null;
  if (armed === rec) disarm();
  if (focusKey === keyOf(rec)) focusKey = null;
  try { rec.player && rec.player.destroy(); } catch {}
  rec.el.remove(); panes.delete(rec.id);
  if (!opts.silent) save(); else toggleEmpty();
}

function applyRect(rec) {
  const { x, y, w, h } = rec.rect;
  Object.assign(rec.el.style, {
    left: (x * 100) + '%', top: (y * 100) + '%',
    width: (w * 100) + '%', height: (h * 100) + '%'
  });
}

function focusPane(rec) {
  document.querySelectorAll('.pane.focus').forEach(p => p.classList.remove('focus'));
  rec.el.classList.add('focus');
  rec.el.style.zIndex = ++zTop;
}

/* ---------- pane builders ---------- */
function buildVideoPane(rec, opts = {}) {
  rec.player = new YT.Player($('.mount', rec.el), {
    videoId: rec.vid,
    width: '100%', height: '100%',
    playerVars: { autoplay: 1, mute: 1, controls: 0, playsinline: 1,
      rel: 0, fs: 0, disablekb: 1, iv_load_policy: 3, origin: location.origin },
    events: {
      onReady: e => {
        try { rec.title = rec.title || e.target.getVideoData().title || ''; } catch {}
        $('.title', rec.el).textContent = rec.title || rec.vid;
        e.target.playVideo();
      },
      onStateChange: e => {
        rec.playing = e.data === YT.PlayerState.PLAYING;
        $('.play', rec.el).textContent = rec.playing ? '⏸' : '▶';
      },
      onError: e => {
        const b = $('.badge', rec.el);
        b.style.display = 'block';
        b.textContent = (+e.data === 101 || +e.data === 150)
          ? 'embed disabled by owner' : 'error ' + e.data;
      }
    }
  });
  $('.title', rec.el).textContent = rec.title || rec.vid;
}

function buildChatPane(rec, opts = {}) {
  const stage = $('.stage', rec.el);
  $('.veil', stage).style.display = 'none';
  $('.badge', stage).style.display = 'none';
  const iframe = document.createElement('iframe');
  iframe.src = `https://www.youtube.com/live_chat?v=${rec.vid}&embed_domain=${location.hostname}&dark_theme=1`;
  iframe.allow = 'autoplay; encrypted-media';
  stage.appendChild(iframe);
  rec.title = rec.title || opts.title || 'live chat';
  $('.title', rec.el).textContent = rec.title;
}

function buildIframePane(rec, src, fallbackTitle) {
  const stage = $('.stage', rec.el);
  $('.veil', stage).style.display = 'none';          // interactive pane
  const iframe = document.createElement('iframe');
  iframe.src = src;
  iframe.allow = 'autoplay; encrypted-media; fullscreen';
  stage.appendChild(iframe);
  rec.title = rec.title || fallbackTitle;
  $('.title', rec.el).textContent = rec.title;
  $('.badge', stage).textContent = 'blank? this site refuses embedding';
}

function buildFilePane(rec) {
  const stage = $('.stage', rec.el);
  const v = document.createElement('video');
  v.src = rec.src; v.muted = true; v.autoplay = true; v.playsinline = true;
  stage.appendChild(v);
  rec.media = v;
  v.addEventListener('play',  () => { rec.playing = true;  $('.play', rec.el).textContent = '⏸'; });
  v.addEventListener('pause', () => { rec.playing = false; $('.play', rec.el).textContent = '▶'; });
  v.addEventListener('error', () => {
    const b = $('.badge', rec.el); b.style.display = 'block';
    b.textContent = 'video file failed to load';
  });
  rec.title = rec.title || rec.src.split('/').pop().slice(0, 40);
  $('.title', rec.el).textContent = rec.title;
}

function veilClick(rec) {
  if (rec.kind === 'twitch') return toast('twitch embeds load muted — no solo');
  if (rec.kind === 'web') return;
  toggleSolo(rec);
}

/* ---------- drag / resize / swap / maximize ---------- */
function startDrag(e, rec) {
  if (e.button !== 0) return;
  e.preventDefault();
  document.body.classList.add('dragging');
  rec.el.classList.add('lift');
  const cr = canvas.getBoundingClientRect();
  const s = { px: e.clientX, py: e.clientY, rect: { ...rec.rect } };
  const move = ev => {
    const dx = (ev.clientX - s.px) / cr.width, dy = (ev.clientY - s.py) / cr.height;
    const snap = v => Math.round(v * 100) / 100;
    rec.rect.x = clamp(snap(s.rect.x + dx), 0, 1 - rec.rect.w);
    rec.rect.y = clamp(snap(s.rect.y + dy), 0, 1 - rec.rect.h);
    applyRect(rec);
  };
  const up = ev => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    // hit-test BEFORE unlifting: while .lift is on, the dragged pane is
    // invisible to elementFromPoint, so the pane under the cursor is the target
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const target = el && el.closest && el.closest('.pane');
    document.body.classList.remove('dragging');
    rec.el.classList.remove('lift');
    if (target && target !== rec.el && panes.has(target.dataset.id)) {
      const other = panes.get(target.dataset.id);
      const origin = { ...s.rect };          // where the drag started
      const targetRect = { ...other.rect };  // the slot being taken
      other.rect = origin;                   // displaced pane → dragged's origin
      rec.rect = targetRect;                 // dragged pane snaps into the slot
      applyRect(other); applyRect(rec);
    }
    save();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function startResize(e, rec) {
  if (e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  document.body.classList.add('dragging');
  const cr = canvas.getBoundingClientRect();
  const s = { px: e.clientX, py: e.clientY, rect: { ...rec.rect } };
  const move = ev => {
    const dx = (ev.clientX - s.px) / cr.width, dy = (ev.clientY - s.py) / cr.height;
    const snap = v => Math.round(v * 100) / 100;
    rec.rect.w = clamp(snap(s.rect.w + dx), 0.12, 1 - rec.rect.x);
    rec.rect.h = clamp(snap(s.rect.h + dy), 0.12, 1 - rec.rect.y);
    applyRect(rec);
  };
  const up = () => { window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    document.body.classList.remove('dragging'); save(); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function toggleMax(rec) {
  if (rec.prevRect) { rec.rect = rec.prevRect; rec.prevRect = null; }
  else { rec.prevRect = { ...rec.rect }; rec.rect = { x: .02, y: .02, w: .96, h: .96 }; }
  applyRect(rec); save();
}

/* ---------- focus ---------- */
function setFocus(rec) {
  focusKey = keyOf(rec);
  focusPane(rec);
  const rest = [...panes.values()].filter(p => p !== rec);
  rec.rect = { x: .01, y: .01, w: .70, h: .98 }; applyRect(rec);
  const n = rest.length, rh = 1 / Math.max(1, n) - .02;
  rest.forEach((p, i) => { p.rect = { x: .72, y: i / n + .01, w: .27, h: rh }; applyRect(p); });
  panes.forEach(p => $('.focusb', p.el).classList.toggle('on', p === rec));
  save();
}

/* ---------- audio: solo model (video + file panes) ---------- */
function audible(rec) { return rec.kind === 'video' || rec.kind === 'file'; }

function toggleSolo(rec) {
  if (!audible(rec)) return toast('this pane carries no audio');
  if (soloId === rec.id) {
    if (rec.player) rec.player.mute();
    if (rec.media) rec.media.muted = true;
    soloId = null;
  } else {
    panes.forEach(p => {
      if (!audible(p)) return;
      if (p.player) p.player.mute();
      if (p.media) p.media.muted = true;
    });
    if (rec.player) { rec.player.unMute(); rec.player.setVolume(100); if (!rec.playing) rec.player.playVideo(); }
    if (rec.media) { rec.media.muted = false; if (rec.media.paused) rec.media.play(); }
    soloId = rec.id;
  }
  refreshSoloUi();
}

function refreshSoloUi() {
  panes.forEach(p => {
    const on = soloId === p.id;
    p.el.classList.toggle('solo', on);
    const a = $('.audio', p.el);
    if (a) { a.classList.toggle('on', on); a.textContent = on ? '🔊' : '🔇'; }
  });
}

function muteAll() {
  soloId = null;
  panes.forEach(p => {
    if (p.player) p.player.mute();
    if (p.media) p.media.muted = true;
  });
  refreshSoloUi();
}

function togglePlay(rec) {
  if (rec.player && rec.player.getPlayerState) {
    rec.playing ? rec.player.pauseVideo() : rec.player.playVideo();
  } else if (rec.media) {
    rec.media.paused ? rec.media.play() : rec.media.pause();
  }
}

/* ---------- replace / arm ---------- */
function armReplace(rec) {
  if (armed === rec) return disarm();
  disarm();
  armed = rec;
  rec.el.classList.add('replace');
  $('#note').textContent = 'paste a url → replaces this pane · esc cancels';
  $('#url').focus();
}
function disarm() {
  if (armed) armed.el.classList.remove('replace');
  armed = null;
  $('#note').textContent = '';
}
function replacePane(rec, parsed) {
  const z = rec.el.style.zIndex;
  const rect = { ...rec.rect };
  const wasFocus = focusKey === keyOf(rec);
  removePane(rec, { silent: true });
  const nr = addPane(parsed, rect, { silent: true });
  if (nr) {
    nr.el.style.zIndex = z || ++zTop;
    if (wasFocus) setFocus(nr);
  }
  save();
  return nr;
}

/* ---------- progress polling ---------- */
setInterval(() => {
  panes.forEach(p => {
    const bar = $('.bar > div', p.el); if (!bar) return;
    try {
      if (p.player && p.player.getCurrentTime) {
        const d = p.player.getDuration(), t = p.player.getCurrentTime();
        if (d > 0) bar.style.width = (t / d * 100) + '%';
      } else if (p.media && p.media.duration > 0) {
        bar.style.width = (p.media.currentTime / p.media.duration * 100) + '%';
      }
    } catch {}
  });
}, 500);

/* ---------- drop targets: canvas + panes ---------- */
canvas.addEventListener('dragover', e => { e.preventDefault(); canvas.classList.add('drop-ok'); });
canvas.addEventListener('dragleave', e => { if (e.target === canvas) canvas.classList.remove('drop-ok'); });
canvas.addEventListener('drop', e => {
  e.preventDefault();
  canvas.classList.remove('drop-ok');
  const raw = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  const parsed = parseRef(raw);
  if (!parsed) return toast('couldn\'t parse that url');
  const paneEl = e.target.closest && e.target.closest('.pane');
  if (paneEl && panes.has(paneEl.dataset.id)) {
    replacePane(panes.get(paneEl.dataset.id), parsed);
    return toast('container reused');
  }
  const cr = canvas.getBoundingClientRect();
  const w = .44, h = .58;
  const rect = {
    x: clamp(Math.round(((e.clientX - cr.left) / cr.width - w / 2) * 100) / 100, 0, 1 - w),
    y: clamp(Math.round(((e.clientY - cr.top) / cr.height - h / 2) * 100) / 100, 0, 1 - h),
    w, h
  };
  addPane(parsed, rect);
});

/* ---------- layout presets ---------- */
const PRESETS = {
  verticals() {
    const n = panes.size; if (!n) return;
    const cols = Math.min(n, 4);
    const cw = 1 / cols;
    const ch = Math.min(1, cw * 16 / 9 * (canvas.clientWidth / canvas.clientHeight));
    const y0 = (1 - ch) / 2;
    [...panes.values()].forEach((p, i) => {
      const c = i % cols, row = Math.floor(i / cols);
      p.rect = { x: c * cw + .01, y: y0 + row * .02, w: cw - .02, h: ch };
      applyRect(p);
    });
  },
  grid() {
    const n = panes.size; if (!n) return;
    const cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
    [...panes.values()].forEach((p, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      p.rect = { x: c / cols + .01, y: r / rows + .01, w: 1 / cols - .02, h: 1 / rows - .02 };
      applyRect(p);
    });
  },
  focus() {
    const list = [...panes.values()]; if (!list.length) return;
    const big = list.find(p => keyOf(p) === focusKey) || list[0];
    setFocus(big);
  },
  cascade() {
    [...panes.values()].forEach((p, i) => {
      p.rect = { x: .02 + i * .07, y: .03 + i * .06, w: .44, h: .55 }; applyRect(p);
    });
  }
};

document.querySelectorAll('[data-preset]').forEach(b =>
  b.addEventListener('click', () => {
    if (!panes.size) return toast('add a video first');
    PRESETS[b.dataset.preset](); save();
  }));

/* ---------- topbar wiring ---------- */
let addMode = 'video';
function setMode(m) {
  addMode = m;
  $('#add').textContent = m === 'chat' ? '+ chat' : '+ add';
  $('#url').placeholder = m === 'chat'
    ? 'paste a live / upcoming stream url — chat becomes a pane'
    : 'paste a url — yt / twitch / vimeo / mp4 / any page';
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === m));
}

function addFromInput() {
  const input = $('#url');
  const ref = input.value;
  if (!ref.trim()) return;
  input.value = '';
  const parsed = parseRef(ref);
  if (!parsed) return toast('couldn\'t parse that url');
  if (armed) {                           // replacing a specific container
    if (addMode === 'chat') parsed.kind = 'chat', parsed.vid = parsed.vid || parsed.src;
    replacePane(armed, parsed); disarm();
    return toast('container reused');
  }
  if (addMode === 'chat') {
    if (parsed.kind !== 'video') return toast('chat needs a youtube stream url');
    parsed.kind = 'chat';
    addPane(parsed, { x: .74, y: .01, w: .25, h: .98 }, { title: 'live chat' });
  } else {
    const i = panes.size;
    addPane(parsed, { x: .02 + i * .07, y: .03 + i * .06, w: .44, h: .55 });
  }
}
$('#add').addEventListener('click', addFromInput);
$('#url').addEventListener('keydown', e => { if (e.key === 'Enter') addFromInput();
  if (e.key === 'Escape') disarm(); });
document.querySelectorAll('[data-mode]').forEach(b =>
  b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#muteall').addEventListener('click', muteAll);
$('#clear').addEventListener('click', () => {
  [...panes.values()].forEach(p => removePane(p, { silent: true }));
  focusKey = null; soloId = null;
  localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_FOCUS);
  toggleEmpty();
  $('#note').textContent = 'cleared';
});
$('#demo').addEventListener('click', () => loadDemo(true));

/* ---------- demo / boot ---------- */
function loadDemo(click) {
  [...panes.values()].forEach(p => removePane(p, { silent: true }));
  focusKey = null;
  addPane({ kind: 'video', vid: 'aqz-KE-bpKQ' }, { x: .02, y: .05, w: .46, h: .58 }, { silent: true }); // Big Buck Bunny
  addPane({ kind: 'video', vid: 'jNQXAC9IVRw' }, { x: .10, y: .13, w: .46, h: .58 }, { silent: true }); // Me at the zoo
  addPane({ kind: 'video', vid: 'eRsGyueVLvQ' }, { x: .18, y: .21, w: .46, h: .58 }, { silent: true }); // Sintel
  localStorage.setItem(LS_SEEN, '1');
  save();
  $('#note').textContent = click ? 'demo wall' : 'demo wall — clear to start yours';
}

window.onYouTubeIframeAPIReady = () => {
  const saved = load();
  if (saved && saved.length) {
    saved.forEach(p => addPane({ kind: p.kind || 'video', vid: p.vid, src: p.src, title: p.title },
      p.rect, { silent: true }));
    focusKey = localStorage.getItem(LS_FOCUS) || null;
    if (focusKey) {
      const big = [...panes.values()].find(p => keyOf(p) === focusKey);
      if (big) setFocus(big);
    }
    $('#note').textContent = `${saved.length} panes restored`;
  } else if (!localStorage.getItem(LS_SEEN)) {
    loadDemo(false);
  } else {
    toggleEmpty();
    $('#note').textContent = 'empty wall';
  }
  refreshSoloUi();
};
(function () {
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => { $('#note').textContent = 'youtube api failed to load — check network'; };
  document.head.appendChild(s);
})();
if (window.YT && window.YT.Player && !window.__pipBooted) {
  const t = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = () => {};
  t();
}
window.__pipBooted = true;
setTimeout(() => {
  if (!window.YT || !window.YT.Player)
    $('#note').textContent = 'youtube api failed to load — check network';
}, 6000);

/* debug / test hook */
window.PIP = {
  panes, solo: id => { const p = panes.get(id); if (p) toggleSolo(p); },
  add: c => addPane(typeof c === 'string' ? { kind: 'video', vid: c }
    : c, { x: .5, y: .3, w: .4, h: .5 }),
  addChat: vid => addPane({ kind: 'chat', vid }, { x: .74, y: .01, w: .25, h: .98 }),
  parse: parseRef, replace: (id, url) => { const p = panes.get(id); if (p) return replacePane(p, parseRef(url)); },
  focusById: id => { const p = panes.get(id); if (p) setFocus(p); },
  presets: PRESETS
};
</script>
</body>
</html>
